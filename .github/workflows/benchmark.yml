name: ArmBench CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run benchmark
        run: armbench run --model resnet18 --backends fp32 int8 onnx_fp32 pruned --runs 10

      - name: Show results
        run: cat results/resnet18_report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: results/